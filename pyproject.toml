[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "costopt"
version = "0.1.7"
description = "Drop-in LLM API cost optimization SDK with lexical similarity caching, smart model routing, and local observability dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "requests>=2.31.0",
]

[project.scripts]
costopt = "costopt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "pricing/providers/*.yaml",
    "pricing/schema.yaml",
    "dashboard/*.html",
    "dashboard/*.css",
    "dashboard/*.js",
]
